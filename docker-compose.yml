services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carbonproof
      POSTGRES_PASSWORD: carbonproof
      POSTGRES_DB: carbonproof
    ports:
      - '5432:5432'
    volumes:
      - carbonproof-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carbonproof -d carbonproof']
      interval: 5s
      timeout: 5s
      retries: 10
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ['anvil', '--host', '0.0.0.0']
    ports:
      - '8545:8545'
    profiles: ['blockchain']
volumes:
  carbonproof-postgres:
